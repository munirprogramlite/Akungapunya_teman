<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maafin Aku Ya? 🥺</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
            position: relative;
        }

        .emoji {
            font-size: 65px;
            margin-bottom: 15px;
            transition: transform 0.2s ease;
        }

        .bounce {
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-15px);}
            60% {transform: translateY(-7px);}
        }

        h1 {
            color: #333;
            font-size: 22px;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid #ff7675;
            border-radius: 25px;
            outline: none;
            font-size: 14px;
            text-align: center;
            color: #333;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
            height: 60px;
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        #btnYes {
            background-color: #ff4757;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
            z-index: 10;
        }

        #btnYes:hover {
            transform: scale(1.05);
            background-color: #ff6b81;
        }

        #btnNo {
            background-color: #ced6e0;
            color: #2f3542;
            position: absolute;
            z-index: 10;
        }

        .success-message {
            display: none;
            text-align: center;
        }

        .success-message h2 {
            color: #2ed573;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div id="questionSection">
            <div class="emoji bounce" id="emojiIcon">🥺</div>
            <h1 id="titleText">Kak, Maafin Saya Ya?</h1>
            <p>Janji nggak bakal diulangi lagi deh. Hehehe 😇</p>
            
            <div class="input-group" id="inputGroup">
                <input type="text" id="nameInput" placeholder="Masukkan nama panggilan kamu ya sayang, di sini..." oninput="updateName()">
            </div>

            <div class="btn-container" id="btnContainer">
                <button id="btnYes" onclick="sayYes()">Mau / Iya</button>
                <button id="btnNo">Nggak</button>
            </div>
        </div>

        <div class="success-message" id="successSection">
            <div class="emoji">🥰</div>
            <h2>Yeay! Makasih udah dimaafin! ❤️</h2>
            <p>You're the best, ehe! ✨</p>
        </div>
    </div>

    <script>
        const btnNo = document.getElementById('btnNo');
        const emojiIcon = document.getElementById('emojiIcon');
        const titleText = document.getElementById('titleText');
        const nameInput = document.getElementById('nameInput');

        // Daftar emotikon bertingkat biar makin dramatis & interaktif
        const cryingEmojis = ["🥺", "💧", "😢", "😭", " Pleaaase 🤲"];
        let emotionIndex = 0;

        function updateName() {
            let name = nameInput.value.trim();
            if (name === "") {
                titleText.innerText = `Kak, Maafin Saya Ya?`;
            } else {
                titleText.innerText = `Kak ${name}, maafin saya ya? hehehe`;
            }
        }

        function moveButton() {
            // Ganti emot secara berurutan tiap kali tombol "Nggak" disentuh/dideketin
            emojiIcon.innerText = cryingEmojis[emotionIndex];
            emotionIndex = (emotionIndex + 1) % cryingEmojis.length;
            emojiIcon.classList.remove('bounce');

            // Pindahkan tombol secara acak di dalam layar
            const maxX = window.innerWidth - btnNo.offsetWidth - 50;
            const maxY = window.innerHeight - btnNo.offsetHeight - 50;

            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);

            btnNo.style.position = 'fixed';
            btnNo.style.left = randomX + 'px';
            btnNo.style.top = randomY + 'px';
        }

        // Event interaktif saat kursor mendekat atau disentuh
        btnNo.addEventListener('mouseover', moveButton);
        btnNo.addEventListener('click', moveButton);
        btnNo.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moveButton();
        });

        function sayYes() {
            document.getElementById('questionSection').style.display = 'none';
            document.getElementById('successSection').style.display = 'block';
        }
    </script>
</body>
</html>
